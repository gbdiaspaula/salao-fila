<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Atendimentos</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
    .filtros { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    input, button { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #007bff; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
  </style>
</head>
<body>

<div class="card">
  <h2>📊 Relatório de Atendimentos</h2>

  <div class="filtros">
    <label>Início:</label>
    <input type="date" id="dataInicio">
    <label>Fim:</label>
    <input type="date" id="dataFim">
    <button onclick="carregarRelatorio()">🔍 Buscar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Data / Hora</th>
        <th>Cliente</th>
        <th>Profissional</th>
        <th>Serviço</th>
      </tr>
    </thead>
    <tbody id="tabelaDados">
      <tr><td colspan="5" style="text-align:center;">Selecione as datas e clique em Buscar.</td></tr>
    </tbody>
  </table>
</div>

<script>
  // Define a data de hoje nos inputs por padrão
  const hoje = new Date().toISOString().split('T')[0];
  document.getElementById('dataInicio').value = hoje;
  document.getElementById('dataFim').value = hoje;

  async function carregarRelatorio() {
    const inicio = document.getElementById('dataInicio').value;
    const fim = document.getElementById('dataFim').value;

    if (!inicio || !fim) {
      alert("Por favor, selecione as datas de início e fim.");
      return;
    }

    try {
      const res = await fetch(`/api/relatorio?dataInicio=${inicio}&dataFim=${fim}`);
      const dados = await res.json();

      const tbody = document.getElementById('tabelaDados');
      tbody.innerHTML = '';

      if (!dados || dados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Nenhum registo encontrado neste período.</td></tr>';
        return;
      }

      dados.forEach(item => {
        const tr = document.createElement('tr');
        
        // Garante a leitura da propriedade 'horario' ou 'data_criacao'
        const horarioExibir = item.horario || item.data_criacao || 'N/D';

        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${horarioExibir}</td>
          <td>${item.cliente}</td>
          <td>${item.profissional}</td>
          <td>${item.servico}</td>
        `;
        tbody.appendChild(tr);
      });
    } catch (erro) {
      console.error("Erro ao carregar relatório:", erro);
      alert("Erro ao buscar dados do relatório.");
    }
  }

  // Carrega automaticamente ao abrir a página
  carregarRelatorio();
</script>

</body>
</html>
