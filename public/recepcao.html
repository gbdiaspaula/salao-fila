<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recepção - Sistema de Chamadas</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f8f9fa; }
    .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; text-align: center; }
    
    .campo { margin-bottom: 15px; display: flex; flex-direction: column; }
    label { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 5px; }
    input, select { padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    
    /* Bloco de múltiplos serviços */
    .item-servico { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    .item-servico select { flex: 1; }
    .btn-remover { background: #dc3545; color: white; border: none; padding: 10px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .btn-add { background: #17a2b8; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 20px; width: 100%; }
    .btn-add:hover { background: #138496; }

    .btn-chamar { background: #28a745; color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; }
    .btn-chamar:hover { background: #218838; }
    
    .btn-nav { background: #6c757d; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🛎️ Recepção - Nova Chamada</h2>

    <div class="campo">
      <label for="cliente">Nome da Cliente:</label>
      <input type="text" id="cliente" placeholder="Digite o nome da cliente" required>
    </div>

    <label>Serviços e Profissionais:</label>
    <div id="listaItens">
      </div>

    <button class="btn-add" type="button" onclick="adicionarLinhaServico()">➕ Adicionar Outro Serviço/Profissional</button>

    <button class="btn-chamar" onclick="enviarChamada()">📢 Chamar no Display</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <button class="btn-nav" onclick="window.open('relatorio.html', '_blank')">📊 Ver Relatórios</button>
  </div>

  <script>
    let listaProfissionais = [];
    let listaServicos = [];

    // Carrega opções de Profissionais e Serviços cadastrados no sistema
    async function carregarOpcoes() {
      try {
        const [resProf, resServ] = await Promise.all([
          fetch('/api/profissionais'),
          fetch('/api/servicos')
        ]);
        
        listaProfissionais = await resProf.json();
        listaServicos = await resServ.json();

        // Adiciona a primeira linha de serviço por padrão
        adicionarLinhaServico();
      } catch (erro) {
        console.error("Erro ao carregar opções:", erro);
      }
    }

    // Função para adicionar um novo par (Profissional + Serviço)
    function adicionarLinhaServico() {
      const container = document.getElementById('listaItens');
      const div = document.createElement('div');
      div.className = 'item-servico';

      // Monta as opções do Select de Profissionais
      let profOptions = '<option value="">Selecione o Profissional</option>';
      listaProfissionais.forEach(p => {
        profOptions += `<option value="${p.nome}">${p.nome}</option>`;
      });

      // Monta as opções do Select de Serviços
      let servOptions = '<option value="">Selecione o Serviço</option>';
      listaServicos.forEach(s => {
        servOptions += `<option value="${s.nome}">${s.nome}</option>`;
      });

      div.innerHTML = `
        <select class="select-prof">${profOptions}</select>
        <select class="select-serv">${servOptions}</select>
        <button type="button" class="btn-remover" onclick="removerLinha(this)">❌</button>
      `;

      container.appendChild(div);
    }

    // Remove uma linha de serviço adicionada
    function removerLinha(botao) {
      const container = document.getElementById('listaItens');
      if (container.children.length > 1) {
        botao.parentElement.remove();
      } else {
        alert("A chamada precisa ter pelo menos 1 serviço!");
      }
    }

    // Envia os dados relacionais para a API
    async function enviarChamada() {
      const cliente = document.getElementById('cliente').value.trim();
      if (!cliente) {
        alert("Por favor, preencha o nome da cliente!");
        return;
      }

      const linhas = document.querySelectorAll('.item-servico');
      const itens = [];

      // Coleta todos os pares de Profissional/Serviço preenchidos
      for (let linha of linhas) {
        const profissional = linha.querySelector('.select-prof').value;
        const servico = linha.querySelector('.select-serv').value;

        if (!profissional || !servico) {
          alert("Por favor, selecione o profissional e o serviço em todos os campos!");
          return;
        }

        itens.push({ profissional, servico });
      }

      try {
        const resposta = await fetch('/api/chamar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cliente, itens })
        });

        if (resposta.ok) {
          alert("Chamada enviada com sucesso!");
          // Limpa o formulário
          document.getElementById('cliente').value = '';
          document.getElementById('listaItens').innerHTML = '';
          adicionarLinhaServico();
        } else {
          alert("Erro ao enviar chamada.");
        }
      } catch (erro) {
        console.error("Erro na requisição:", erro);
        alert("Falha de conexão com o servidor.");
      }
    }

    // Inicializa a tela
    carregarOpcoes();
  </script>
</body>
</html>
