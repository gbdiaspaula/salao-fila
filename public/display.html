<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display - Chamadas</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* SEU CSS ORIGINAL DE ONTEM */
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 30px;
      color: #f39c12;
      text-transform: uppercase;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .card {
      background-color: #1e1e1e;
      border-left: 10px solid #27ae60;
      border-radius: 8px;
      padding: 20px 40px;
      width: 80%;
      max-width: 800px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: aparecer 0.5s ease-in-out;
    }

    .cliente {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      text-align: left;
    }

    .detalhes {
      text-align: right;
    }

    .servico {
      font-size: 1.8rem;
      color: #3498db;
      font-weight: bold;
    }

    .profissional {
      font-size: 1.4rem;
      color: #bdc3c7;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <h1>🔔 Chamadas Recentes</h1>

  <div class="container" id="lista-chamadas">
    </div>

  <script>
    const socket = io();

    socket.on('nova_chamada', (dados) => {
      const container = document.getElementById('lista-chamadas');

      // Adaptação rápida para ler múltiplos itens mantendo a formatação original
      let servicoTexto = dados.servico || '';
      let profissionalTexto = dados.profissional || '';

      if (dados.itens && Array.isArray(dados.itens)) {
        servicoTexto = dados.itens.map(i => i.servico).join(' + ');
        profissionalTexto = dados.itens.map(i => i.profissional).join(', ');
      }

      // Estrutura EXATA do Card de Ontem
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="cliente">${dados.cliente}</div>
        <div class="detalhes">
          <div class="servico">${servicoTexto}</div>
          <div class="profissional">${profissionalTexto}</div>
        </div>
      `;

      container.insertBefore(card, container.firstChild);
    });
  </script>
</body>
</html>
