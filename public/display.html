<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display - Chamadas</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 30px;
      color: #f39c12;
      text-transform: uppercase;
    }

    /* Tela de Início / Liberação de Áudio */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #btn-iniciar {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #btn-iniciar:hover {
      background-color: #219150;
    }

    /* Container de Cards */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .card {
      background-color: #1e1e1e;
      border-left: 10px solid #27ae60;
      border-radius: 8px;
      padding: 20px 40px;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: aparecer 0.5s ease-in-out;
    }

    .cliente {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      text-align: left;
    }

    .detalhes {
      text-align: right;
    }

    .servico {
      font-size: 1.8rem;
      color: #3498db;
      font-weight: bold;
    }

    .profissional {
      font-size: 1.4rem;
      color: #bdc3c7;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div id="overlay">
    <button id="btn-iniciar" onclick="iniciarDisplay()">▶️ Clique para Iniciar o Display</button>
  </div>

  <h1>🔔 Chamadas Recentes</h1>

  <div class="container" id="lista-chamadas">
    </div>

  <script>
    let socket;

    function iniciarDisplay() {
      // Esconde a tela de início
      document.getElementById('overlay').style.display = 'none';

      // Conecta ao Socket.io
      socket = io();

      // Ouve os eventos de chamadas
      socket.on('nova_chamada', (dados) => {
        const container = document.getElementById('lista-chamadas');

        let textoServicos = '';
        let textoProfissionais = '';

        if (dados.itens && Array.isArray(dados.itens)) {
          textoServicos = dados.itens.map(i => i.servico).join(' + ');
          textoProfissionais = dados.itens.map(i => i.profissional).join(', ');
        } else {
          textoServicos = dados.servico || '';
          textoProfissionais = dados.profissional || '';
        }

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="cliente">${dados.cliente}</div>
          <div class="detalhes">
            <div class="servico">${textoServicos}</div>
            <div class="profissional">${textoProfissionais}</div>
          </div>
        `;

        container.insertBefore(card, container.firstChild);
      });
    }
  </script>
</body>
</html>
